name: Deploy Dev

on:
  push:
    branches: [ develop ]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: development

    steps:
      # 레포에 있는 docker-compose.yml을 서버로 올리려면 checkout이 필요
      - name: Checkout
        uses: actions/checkout@v4

      # (중요) 서버의 /opt/dev/docker-compose.yml을 항상 최신으로 유지
      - name: Upload docker-compose.yml to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/dev"
          overwrite: true

      - name: Create .env on Lightsail
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cat > /opt/dev/.env << 'EOF'
            SPRING_PROFILES_ACTIVE=${{ secrets.PROFILES_ACTIVE }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SPRING_DATASOURCE_URL=${{ secrets.DB_URL }}
            SPRING_DATASOURCE_USERNAME=${{ secrets.DB_USER }}
            SPRING_DATASOURCE_PASSWORD=${{ secrets.DB_PASSWORD }}
            SPRING_DATA_REDIS_HOST=redis
            SPRING_DATA_REDIS_PORT=6379
            EOF

      - name: Restart dev containers (pull & recreate)
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/dev

            docker compose -f /opt/dev/docker-compose.yml pull
            docker compose -f /opt/dev/docker-compose.yml up -d --force-recreate
            docker compose -f /opt/dev/docker-compose.yml ps
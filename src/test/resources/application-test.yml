spring:
  # Test database (H2 in-memory)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: false
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never
  
  cache:
    type: simple

  mail:
    username: test-smtp-username
    password: test-smtp-password

account-validation:
  methods:
    - FORMAT
  cache:
    enabled: false
  format-validation:
    enabled: true
    strict-mode: false
  api-limits:
    daily-limit: 10000
    monthly-limit: 100000
    rate-limit: 1000

logging:
  level:
    com.tropig.backend: WARN
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

jwt:
  secret: "your256bitSecretKeyPleaseChangeItThisIsTestTest"
  expiration: 3600000
  refresh-expiration: 86400000

# Test environment variables (dummy values for testing)
mail:
  sender:
    address: test@example.com
    name: Test Sender
  subjects:
    sign_up: "가입을 환영합니다"
    receipt: "구매 확정 안내"

aws:
  s3:
    bucket: test-bucket
    region: ap-northeast-2
    access-key: test-access-key
    secret-key: test-secret-key

portone:
  key:
    secret-v2: test-portone-secret-v2
  base-url: http://localhost:9999
  store-id: test-store-id
  identity-verification:
    channel-key: test-chennel-key
  channels:
    kcp: ${PORTONE_KCP_CHANNEL_KEY}
    kakao-pay: ${PORTONE_KAKAO_PAY_CHANNEL_KEY}

encryption:
  secret-key: WA2U2V0nO/a/puEzjgLmzdojyeO3a+r7KcXSoImjVmk=

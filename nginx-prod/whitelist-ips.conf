# IP 화이트리스트 (geo 모듈)
# nginx.conf의 http 블록에서 include하여 사용
# $whitelist_ip 변수: 1이면 허용, 0이면 차단

geo $whitelist_ip {
    default 0;

    # 로컬호스트
    127.0.0.1 1;
    ::1 1;

    # 내부 네트워크 (Docker Compose 고정 서브넷 - prod)
    172.21.0.0/24 1;

    # 공인 IP
    122.35.214.69 1;
    221.138.10.184 1;
    218.237.216.45 1;
    125.244.110.148 1;
    211.207.144.239 1;

    114.205.149.228 1;
    210.126.8.226 1;
}

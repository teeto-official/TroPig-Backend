# 도메인 화이트리스트 (map 모듈)

map $http_origin $allowed_origin {
    default 0;

    # 로컬 개발 환경
    "http://localhost:3000" 1;
    "http://localhost:3001" 1;
    "http://127.0.0.1:3000" 1;

    # 프로덕션 도메인
    "https://triquest.me" 1;
    "https://www.triquest.me" 1;
    "https://tri-quest.vercel.app" 1;
}

map $http_referer $allowed_referer {
    default 0;

    "~*^https?://localhost" 1;
    "~*^https?://triquest\.me" 1;
    "~*^https?://www\.triquest\.me" 1;
    "~*^https?://tri-quest\.vercel\.app" 1;
}

map $http_x_internal_token $allowed_internal {
    default 0;
    "${INTERNAL_API_SECRET}" 1;
}

map $http_host $allowed_host {
    default 0;

    "localhost" 1;
    "localhost:80" 1;
    "localhost:8080" 1;
    "api.triquest.me" 1;
    "triquest.me" 1;
}

# 도메인 화이트리스트 파일
# 이 파일에 허용할 도메인을 추가하세요
# include 디렉티브로 다른 설정 파일에서 사용 가능

# Origin 헤더 기반 화이트리스트 (추천)
# map 디렉티브는 http 블록에서 사용해야 하므로,
# 이 파일은 nginx.conf의 http 블록에서 include하세요

# Origin 헤더 검증 (CORS 요청)
map $http_origin $allowed_origin {
    default 0;

    # 로컬 개발 환경
    "http://localhost:3000" 1;
    "http://localhost:3001" 1;
    "http://127.0.0.1:3000" 1;

    # 프로덕션 도메인
    "https://triquest.me" 1;
    "https://www.triquest.me" 1;

    "https://tri-quest.vercel.app" 1;
    "https://dev.triquest.me" 1;

    # 추가 도메인 (예시)
    # "https://partner.example.com" 1;
}

# Referer 헤더 검증 (보조 수단)
map $http_referer $allowed_referer {
    default 0;

    # 정규표현식으로 도메인 매칭
    "~*^https?://localhost" 1;
    "~*^https?://triquest\.me" 1;
    "~*^https?://tri-quest\.vercel\.app/*" 1;
    "~*^https?://.*\.triquest\.me" 1;  # 모든 서브도메인

    # 추가 도메인 (예시)
    # "~*^https?://partner\.example\.com" 1;
}

# Host 헤더 검증 (요청 대상 도메인)
map $http_host $allowed_host {
    default 0;

    "localhost" 1;
    "localhost:80" 1;
    "localhost:8080" 1;
    "api.triquest.me" 1;

    # 추가 도메인 (예시)
    # "api.partner.com" 1;
}

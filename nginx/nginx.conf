user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '"$http_origin"';  # Origin 헤더 로깅 추가

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ===== 도메인 화이트리스트 설정 =====
    # whitelist-domains.conf 파일 include (map 디렉티브 포함)
    include /etc/nginx/whitelist-domains.conf;

    # ===== IP 화이트리스트 설정 (geo 모듈) =====
    geo $whitelist_ip {
        default 0;

        # 로컬호스트
        127.0.0.1 1;
        ::1 1;

        # 내부 네트워크
        10.0.0.0/8 1;
        172.16.0.0/12 1;
        192.168.0.0/16 1;

        # 공인 IP (whitelist-ips.conf에서 가져온 IP)
        122.35.214.69 1;
        221.138.10.184 1;
        218.237.216.45 1;
    }

    # ===== 액세스 제어 로직 =====
    # IP 또는 도메인이 화이트리스트에 있으면 허용
    map $whitelist_ip$allowed_origin $access_allowed {
        default 0;
        "~1" 1;  # IP가 1이거나 Origin이 1이면 허용
    }

    # server 블록 설정 파일 include
    include /etc/nginx/conf.d/*.conf;
}

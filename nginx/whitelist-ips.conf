# IP 화이트리스트 파일
# 이 파일에 허용할 IP 주소를 추가하세요
# include 디렉티브로 다른 설정 파일에서 사용 가능

# 로컬호스트
allow 127.0.0.1;
allow ::1;

# 내부 네트워크 (Private IP ranges)
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;

# 공인 IP 주소 (예시 - 실제 IP로 변경)
# allow 203.0.113.50;        # 회사 본사 IP
# allow 198.51.100.0/24;     # 파트너사 IP 대역
# allow 2001:db8::/32;       # IPv6 주소
allow 122.35.214.69;
allow 221.138.10.184;
allow 218.237.216.45;
allow 125.244.110.148;
allow 211.207.144.239;

# 클라우드 서비스 IP (필요시)
# AWS CloudFront IP ranges
# allow 13.224.0.0/12;
# allow 13.32.0.0/15;

# Cloudflare IP ranges (예시)
# allow 173.245.48.0/20;
# allow 103.21.244.0/22;

# 나머지 모든 IP 차단
deny all;

# IP + 도메인 화이트리스트 설정
# IP 주소와 도메인을 모두 검증하는 설정

# 이 파일을 사용하려면:
# 1. ip-and-domain-whitelist.conf로 이름 변경
# 2. nginx.conf의 http 블록에 whitelist-domains.conf include
# 3. 실제 IP와 도메인으로 수정

upstream backend {
    server app:8080;
}

# whitelist-domains.conf에서 정의한 map 변수 사용
# nginx.conf의 http 블록에 다음을 추가:
# include /etc/nginx/whitelist-domains.conf;

server {
    listen 80;
    server_name localhost;

    # Health check endpoint (화이트리스트 제외)
    location /health {
        access_log off;
        proxy_pass http://backend/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints (IP + 도메인 화이트리스트)
    location /api {
        # IP 또는 도메인이 허용되면 접근 허용
        # $whitelist_ip는 nginx.conf의 geo 모듈에서 정의
        # $allowed_origin은 whitelist-domains.conf에서 정의
        set $access_granted 0;

        # IP가 화이트리스트에 있으면 허용
        if ($whitelist_ip = 1) { set $access_granted 1; }

        # 도메인이 화이트리스트에 있으면 허용
        if ($allowed_origin = 1) { set $access_granted 1; }

        # 둘 다 실패하면 403 반환
        if ($access_granted = 0) {
            return 403 '{"error": "Access denied", "message": "Your IP or domain is not whitelisted", "ip": "$remote_addr", "origin": "$http_origin"}';
        }

        # CORS 헤더 설정
        add_header 'Access-Control-Allow-Origin' $http_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin;
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
    }

    # Actuator endpoints (IP만 체크)
    location /actuator {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (개발 환경 - 모든 IP 허용)
    location /swagger-ui {
        # 개발 환경에서는 모든 IP 허용
        allow all;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /swagger 경로 추가 (일부 Swagger 버전)
    location /swagger {
        allow all;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        # 개발 환경에서는 모든 IP 허용
        allow all;

        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # All other requests
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

services:
  app:
    image: ghcr.io/teeto-official/tropig-backend:master
    container_name: prod-api-1
    ports:
      - "8080:8080"
    env_file:
      - /opt/prod/.env
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - /opt/prod/.env
    environment:
      - NGINX_ENVSUBST_TEMPLATE_VARS=INTERNAL_API_SECRET
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/whitelist-ips.conf:/etc/nginx/whitelist-ips.conf:ro
      - ./nginx/whitelist-domains.conf:/etc/nginx/whitelist-domains.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - web-root:/var/www/html
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - internal

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - web-root:/var/www/html
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/html --email teeto.team.official@gmail.com --agree-tos --no-eff-email -d api.triquest.me -d triquest.me
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    name: tropig-prod
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  redis-data:
  certbot-var:
  web-root:
